name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  flutter-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hw_41
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (dev debug)
        run: flutter build apk --debug --flavor dev -t lib/main_dev.dart

      - name: Build APK (prod debug)
        run: flutter build apk --debug --flavor prod -t lib/main_prod.dart

      - name: Build APK (dev release)
        run: flutter build apk --release --flavor dev -t lib/main_dev.dart --build-number "${BUILD_NUMBER}"

      - name: Build APK (prod release)
        run: flutter build apk --release --flavor prod -t lib/main_prod.dart --build-number "${BUILD_NUMBER}"
